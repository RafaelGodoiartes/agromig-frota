<!doctype html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:white;color:#183f2d;font:15px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1,h2,h3{color:#1f7a46}header{border-bottom:1px solid #cfe8d5;padding-bottom:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,a.button{background:#1f7a46;color:white;border:0;border-radius:6px;padding:11px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #b8d7c2;border-radius:5px;padding:10px;font:inherit;background:white}[hidden]{display:none!important}label{display:block;font-size:13px}form,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}section{border:1px solid #cfe8d5;border-radius:10px;padding:18px;margin:18px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{background:#f2f9f4}.scroll{overflow:auto}small{display:block;color:#5b7467;margin:6px 0}.notice{background:#fff9e8;border:1px solid #e8d597;padding:12px;margin:14px 0;border-radius:6px}#message{white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-word;font:13px Arial}details{margin:12px 0}a{color:#1f7a46}.actions{display:flex;gap:8px;flex-wrap:wrap}input[type=checkbox]{width:auto}h3{font-size:16px}@media(max-width:650px){form,.grid{grid-template-columns:1fr}main{padding:12px}}
.scroll table:has(th:nth-child(5)){min-width:850px}.scroll table:has(th:nth-child(5)) td:last-child{min-width:340px}
@media(max-width:650px){.scroll:has(th:nth-child(5))::before{content:'Deslize a tabela para ver os motivos e orientações.';display:block;color:#5b7467;font-size:13px;margin:8px 0}}
</style></head><body><main><header><h1>Bonificações dos Motoristas</h1><p>Painel Gerencial de Frotas · AGROMIG · área operacional restrita</p><small>Conta autorizada: frota@agromig.com.br. Sem aprovação humana, nenhum valor se torna definitivo e nenhum relatório é enviado.</small></header>
<p id="message" role="status">Carregando cadastro e histórico…</p><div class="grid"><label>Motorista<select id="driver"></select></label><label>Competência<input id="month" type="month"></label></div><nav id="nav"></nav><div id="content"></div></main>
<script>
let state=null, page='Registros', request=0, importPreview=null;
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), brl=c=>c==null?'Não disponível':(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
const message=text=>$('message').textContent=text;
async function run(task,success='Operação concluída.'){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await task();message(success);return result}catch(error){message(error.message||String(error));return null}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const ticket=++request;try{const next=await call('getDriverBonusesState');if(ticket!==request)return;state=next;const previous=$('driver').value;$('driver').innerHTML=state.drivers.map(d=>'<option>'+esc(d.name)+'</option>').join('');if(state.drivers.some(d=>d.name===previous))$('driver').value=previous;message('Cadastro atualizado. Matrícula e cargo não disponíveis na fonte atual.');render()}catch(error){message(error.message||String(error))}}
const input=(label,name,type='text',required=true,value='')=>'<label>'+esc(label)+'<input name="'+name+'" type="'+type+'" '+(type==='number'?'step="any" ':'')+(required?'required ':'')+'value="'+esc(value)+'"></label>';
const fileInput=()=>'<label class="wide">Documento original (JPG, PNG ou PDF)<input name="file" type="file" accept="image/jpeg,image/png,application/pdf"></label>';
const vehicleSelect=()=>'<label>Veículo / placa<select name="plate" required>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'">'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select></label>';
const driver=()=>$('driver').value, month=()=>$('month').value;
const selectedRecords=()=>state.records.filter(r=>r.driver===driver()&&r.month===month());
async function fileData(file){if(!file||!file.size)return null;if(file.size>8*1024*1024)throw Error('Arquivo deve ter até 8 MB.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mimeType:file.type||(/\.xlsx$/i.test(file.name)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/vnd.ms-excel'),base64:String(reader.result).split(',')[1]});reader.onerror=reject;reader.readAsDataURL(file)})}
function bindForm(id,fn){$(id).onsubmit=e=>{e.preventDefault();const form=e.target;run(async()=>{await fn(Object.fromEntries(new FormData(form)),form);await load()})}}
function render(){if(!state)return;const tabs=['Registros','Nova viagem','Cargo de confiança','KPIs','Utilização','Lavagem e multas','Relatórios e e-mails','Configurações'];$('nav').innerHTML=tabs.map(t=>'<button data-page="'+esc(t)+'" aria-pressed="'+(t===page)+'">'+esc(t)+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
if(page==='Registros')renderRecords();else if(page==='Nova viagem')renderTrip();else if(page==='Cargo de confiança')renderTrust();else if(page==='KPIs')renderKpis();else if(page==='Utilização')renderAssignments();else if(page==='Lavagem e multas')renderOperations();else if(page==='Relatórios e e-mails')renderReports();else renderConfig();}
function manualEvidenceLinks(record){
  const rows=[...Object.values(record.details?.manualAssessment?.categories||{}).flatMap(category=>category.rows), ...(record.details?.checklistSelection?.categories?.Checklist?.rows||[])].filter(row=>row.evidence?.url);
  return rows.length?'<h3>Evidências das ocorrências</h3>'+rows.map(row=>'<p><a href="'+esc(row.evidence.url)+'" target="_blank" rel="noopener">'+esc(row.category+' · '+row.date+' · '+row.plate+' — '+row.evidence.name)+'</a></p>').join(''):'';
}
function kpiPendingGuidance(reason){
  if(/Histórico de responsabilidade/i.test(reason))return 'Em Utilização, registre os períodos comprovados em que este motorista foi responsável pelas placas e confira se cobrem os dias trabalhados. Depois recalcule os KPIs.';
  if(/Consulta de checklist incompleta/i.test(reason))return 'Em KPIs, confira a consulta ao Epicollect5. Se houver comprovação manual, escolha Manual, informe os dias e veículos realizados e justifique. Depois recalcule.';
  if(/Defina as datas de lavagem/i.test(reason))return 'Em KPIs, confira os dias realmente trabalhados e as datas em que a lavagem era exigida; não informe datas sem exigência real.';
  if(/Lavagem/i.test(reason))return 'Em KPIs, confira a resposta sobre lavagem e as datas/placas declaradas; confirme apenas os serviços efetivamente realizados.';
  if(/Circulação/i.test(reason))return 'Confira as datas, veículos e autorização da circulação fora do horário, além do período em Utilização. Não retire uma ocorrência real para aumentar a bonificação.';
  if(/Velocidade/i.test(reason))return 'Confira a resposta, as ocorrências de velocidade e os períodos de responsabilidade em Utilização; esclareça informações conflitantes antes de recalcular.';
  if(/Multas/i.test(reason))return 'Confira a atribuição, confirmação ou contestação da multa em Lavagem e multas e os períodos em Utilização. Depois recalcule.';
  return 'Confira esta pendência nas informações e evidências do período antes de recalcular ou solicitar aprovação.';
}
function kpiExplanationModel(record){
  if(record.category!=='KPIs')return null;
  const calc=record.calculation||{},validMoney=value=>Number.isSafeInteger(value)&&value>=0;
  const pending=[...new Set(calc.pending||[])],hasResponsibility=pending.some(reason=>/Histórico de responsabilidade/i.test(reason));
  const eliminated=calc.eliminationSuggested===true,source=record.details?.checklistSelection?.source||'';
  const rows=(calc.results||[]).map(item=>{
    const maximum=validMoney(item.maximumCents)?item.maximumCents:null,considered=validMoney(item.cents)?(eliminated?0:item.cents):null;
    const missingDates=[...new Set(item.missingDates||[])],actions=[];
    if(eliminated)actions.push('Confira a ocorrência eliminatória de circulação fora do horário. A decisão é humana; esta linha não pode ser recuperada isoladamente enquanto a eliminação estiver indicada.');
    else if(maximum!==null&&considered!==null&&considered<maximum){
      if(item.criterion==='Checklist'){
        actions.push('Confira os dias trabalhados, a placa e o nome do motorista. As datas abaixo não tiveram checklist válido reconhecido nesta avaliação; isso não prova que ele não realizou.');
        if(hasResponsibility)actions.push('Registre os períodos comprovados em Utilização: sem responsabilidade válida, um checklist enviado pode não ser considerado.');
        actions.push(source==='Manual'?'Em KPIs → Manual, confira e informe somente os dias/placas com checklist realizado, a justificativa e a conferência.':'Em KPIs, confira os registros do Epicollect5; se houver comprovação manual, selecione Manual e informe os dias/placas realizados.');
      }else if(item.criterion==='Lavagem'){
        actions.push('Compare as datas de lavagem exigidas com as datas/placas efetivamente lavadas em KPIs ou Lavagem e multas. Datas diferentes não cobrem automaticamente a exigência.');
        if(hasResponsibility)actions.push('Confira também o período comprovado em Utilização; uma lavagem sem atribuição válida não é considerada.');
      }else actions.push('Confira as ocorrências deste item e suas evidências. Uma ocorrência confirmada pode impedir o valor integral; não há garantia de recuperar a diferença apenas editando o formulário.');
    }else actions.push(considered===null?'Detalhamento indisponível neste registro; confira os detalhes originais antes de qualquer alteração.':'Valor integral deste item no cálculo salvo. Confira também as pendências gerais antes da aprovação.');
    return {criterion:item.criterion,maximum,considered,difference:maximum!==null&&considered!==null?Math.max(0,maximum-considered):null,reason:item.reason||'Motivo não disponível no registro.',missingDates,actions};
  });
  const maximum=validMoney(calc.maximumCents)?calc.maximumCents:null,total=validMoney(calc.cents)?calc.cents:null;
  return {rows,maximum,total,difference:maximum!==null&&total!==null?Math.max(0,maximum-total):null,eliminated,pending:pending.map(reason=>({reason,action:kpiPendingGuidance(reason)})),occurrences:calc.occurrences||[],locked:['Aprovado','Pago'].includes(record.status)};
}
function kpiExplanationMarkup(record){
  const model=kpiExplanationModel(record);if(!model)return '';
  const dateLabel=value=>/^\d{4}-\d{2}-\d{2}$/.test(value)?value.split('-').reverse().join('/'):value;
  return '<section><h3>Por que este valor? — KPIs</h3><p><strong>'+esc(brl(model.total))+' de '+esc(brl(model.maximum))+'</strong> · Status: '+esc(record.status)+'</p>'+(model.difference!==null?'<p>'+esc(brl(model.difference))+' não considerado(s) em relação ao máximo desta avaliação.</p>':'<p>Não há dados suficientes para demonstrar a diferença neste registro.</p>')+'<small>Explicação do cálculo salvo para '+esc(record.month)+'. Não altera valores, não aprova e não comprova pagamento. O máximo usa as regras registradas nesta competência.</small>'+(model.eliminated?'<div class="notice"><strong>Eliminação integral indicada — circulação fora do horário</strong><p>O cálculo foi zerado por ocorrência eliminatória registrada. Os valores abaixo já refletem essa indicação, sujeita à conferência e decisão humana.</p></div>':'')+(model.rows.length?'<div class="scroll"><table><thead><tr><th>Item</th><th>Máximo</th><th>Considerado</th><th>Não considerado</th><th>Por quê / o que conferir</th></tr></thead><tbody>'+model.rows.map(row=>'<tr><td>'+esc(row.criterion)+'</td><td>'+esc(brl(row.maximum))+'</td><td>'+esc(brl(row.considered))+'</td><td>'+esc(brl(row.difference))+'</td><td><p>'+esc(row.reason)+'</p>'+(row.missingDates.length?'<p><strong>Datas sem comprovação válida nesta avaliação:</strong> '+row.missingDates.map(date=>esc(dateLabel(date))).join(', ')+'</p>':'')+'<ul>'+row.actions.map(action=>'<li>'+esc(action)+'</li>').join('')+'</ul></td></tr>').join('')+'</tbody></table></div>':'<p>Este registro não possui detalhamento por KPI. Consulte os detalhes originais.</p>')+(model.pending.length?'<div class="notice"><h3>Pendências que impedem aprovação</h3><ul>'+model.pending.map(item=>'<li><strong>'+esc(item.reason)+'</strong><p>'+esc(item.action)+'</p></li>').join('')+'</ul><small>Uma pendência pode bloquear a aprovação mesmo quando um item aparece com valor integral.</small></div>':'')+(model.occurrences.length?'<details><summary>Ocorrências consideradas no cálculo ('+model.occurrences.length+')</summary><ul>'+model.occurrences.map(row=>'<li>'+esc([row.criterion,dateLabel(row.date||''),row.plate,row.reason].filter(Boolean).join(' · '))+'</li>').join('')+'</ul></details>':'')+'<p>'+(model.locked?'Registro aprovado/pago: alterações exigem reabertura da análise pelo fluxo existente; o histórico será preservado.':'Depois de corrigir informações comprovadas em KPIs ou Utilização, volte a KPIs e clique em Recalcular avaliação não aprovada. A explicação muda somente após salvar o novo cálculo.')+'</p><div class="actions"><button data-kpi-help-page="KPIs">Abrir avaliação de KPIs</button><button data-kpi-help-page="Utilização">Abrir Utilização</button></div></section>';
}
function renderRecords(){const rows=selectedRecords();$('content').innerHTML='<section><h2>Histórico individual</h2><p>'+esc(driver())+' · '+esc(month())+'</p><p>Viagens aprovadas: '+brl(rows.filter(r=>r.category==='Viagem'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+' · Cargo aprovado: '+brl(rows.filter(r=>r.category==='Cargo de confiança'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+' · KPIs aprovados: '+brl(rows.filter(r=>r.category==='KPIs'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+'</p>'+rows.map(kpiExplanationMarkup).join('')+'<div class="scroll"><table><tr><th>Categoria</th><th>Valor provisório / aprovado</th><th>Status</th><th>Documentos e histórico</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.category)+'</td><td>'+brl(r.calculation.cents)+' / '+(r.approved?brl(r.approved.cents):'Não aprovado')+'</td><td>'+esc(r.status)+'</td><td><details><summary>Consultar</summary><pre>'+esc(JSON.stringify({detalhes:r.details,calculo:r.calculation,justificativa:r.justification,historico:r.actions},null,2))+'</pre>'+(r.evidence?'<a href="'+esc(r.evidence.url)+'" target="_blank" rel="noopener">Abrir / baixar original no Drive</a>':'Sem documento anexado')+manualEvidenceLinks(r)+'</details><div class="actions"><button data-transition="'+esc(r.id)+'">Alterar status</button><button data-attach="'+esc(r.id)+'">Anexar documento</button></div></td></tr>').join('')+'</table></div>'+(rows.length?'':'<p>Nenhum registro nesta competência.</p>')+'</section><div id="statusEditor"></div>';
$('content').querySelectorAll('[data-kpi-help-page]').forEach(b=>b.onclick=()=>{page=b.dataset.kpiHelpPage;render();});
$('content').querySelectorAll('[data-transition]').forEach(b=>b.onclick=()=>openStatusEditor(state.records.find(r=>r.id===b.dataset.transition)));
$('content').querySelectorAll('[data-attach]').forEach(b=>b.onclick=()=>{const field=document.createElement('input');field.type='file';field.accept='image/jpeg,image/png,application/pdf';field.onchange=()=>run(async()=>{await call('addBonusEvidence',b.dataset.attach,await fileData(field.files[0]));await load()});field.click()});}
function openStatusEditor(record){
  if(!record)return;
  const next=record.nextStatuses||[], blockers=record.approvalBlockers||[];
  $('statusEditor').innerHTML='<section aria-labelledby="statusTitle"><h2 id="statusTitle">Alterar status do registro</h2><p>'+esc(record.category)+' · '+esc(record.driver)+' · '+esc(record.month)+'</p><p>Status atual: <strong>'+esc(record.status)+'</strong></p><small>Fluxo de aprovação: Em análise → Aguardando aprovação → Aprovado. Cada etapa fica registrada no histórico.</small>'+(blockers.length?'<div class="notice"><strong>Pendências que impedem a aprovação</strong><ul>'+blockers.map(reason=>'<li>'+esc(reason)+'</li>').join('')+'</ul><p>Anexe os documentos ou recalcule os KPIs depois de resolver as pendências.</p></div>':'')+'<form id="statusForm"><label>Próximo status<select name="status" required><option value="">Selecione a próxima etapa</option>'+next.map(status=>'<option>'+esc(status)+'</option>').join('')+'</select></label><label>Justificativa da alteração<textarea name="justification" required rows="3"></textarea></label><label class="wide" id="approvalReview" hidden><input name="reviewed" type="checkbox"> Conferi os dados, cálculos, responsabilidade e documentos deste registro e confirmo a aprovação.</label><p class="wide" id="statusFeedback" role="status"></p><div class="actions wide"><button type="submit">Salvar alteração de status</button><button id="cancelStatus" type="button">Cancelar</button></div></form></section>';
  const form=$('statusForm'), feedback=$('statusFeedback');
  form.elements.status.onchange=()=>{
    const approving=form.elements.status.value==='Aprovado';
    $('approvalReview').hidden=!approving;
    form.elements.reviewed.required=approving;
    form.elements.reviewed.checked=false;
    feedback.textContent=approving&&blockers.length?'Aprovação bloqueada: resolva as pendências indicadas acima.':'';
  };
  $('cancelStatus').onclick=()=>{$('statusEditor').innerHTML='';};
  form.onsubmit=e=>{
    e.preventDefault();
    const status=form.elements.status.value, reason=form.elements.justification.value.trim(), reviewed=form.elements.reviewed.checked;
    if(!status||!reason){feedback.textContent='Selecione a próxima etapa e informe uma justificativa.';return;}
    if(status==='Aprovado'&&(blockers.length||!reviewed)){feedback.textContent=blockers.length?'Aprovação bloqueada: resolva as pendências indicadas acima.':'Confirme a conferência antes de aprovar.';return;}
    run(async()=>{
      try{
        const updated=await call('transitionDriverBonus',record.id,status,reason,reviewed,record.status);
        await load();
      }catch(error){feedback.textContent=error.message||String(error);throw error;}
    },'Status atualizado para '+status+'. Histórico preservado.');
  };
  form.elements.status.focus();
}
function renderTrip(){$('content').innerHTML='<section><h2>Bonificação por viagem</h2><form id="trip">'+vehicleSelect()+input('Número da requisição','request')+input('Data da viagem','date','date')+input('Origem','origin')+input('Destino','destination')+input('KM inicial','initialKm')+input('KM final','finalKm')+'<p id="tripPreview">Tarifa padrão: R$ 0,90/KM. O servidor aplica a regra vigente na competência.</p>'+input('Observações','notes','text',false)+fileInput()+'<button class="wide">Salvar rascunho</button></form></section>';
bindForm('trip',async values=>call('saveDriverBonus',{...values,driver:driver(),month:month(),category:'Viagem',file:await fileData(values.file)}));
$('trip').oninput=()=>{const start=Number($('trip').elements.initialKm.value.replace(',','.')),end=Number($('trip').elements.finalKm.value.replace(',','.'));$('tripPreview').textContent=Number.isFinite(start)&&end>start?(end-start).toLocaleString('pt-BR')+' KM — calculado no servidor ao salvar':'Informe KM final maior que o inicial.'}}
function renderTrust(){$('content').innerHTML='<section><h2>Cargo de confiança</h2><p>Concessão individual · padrão R$ 1.000,00 por competência. Nunca concedido automaticamente.</p><form id="trust">'+input('Justificativa','justification')+input('Autorização / referência','authorization')+fileInput()+'<button class="wide">Salvar rascunho</button></form></section>';bindForm('trust',async values=>call('saveDriverBonus',{...values,driver:driver(),month:month(),category:'Cargo de confiança',file:await fileData(values.file)}))}
const manualQuestions={'Circulação':'Houve circulação fora do horário autorizado?','Velocidade':'Houve excesso do limite de velocidade aplicável?','Lavagem':'Foram realizadas lavagens?','Multas':'Houve multas?'};
function bonusDateChoices(label,name,selected=''){
  const [year,m]=month().split('-').map(Number), count=new Date(year,m,0).getDate(), chosen=new Set(selected.split(/[,;\s]+/));
  const range=name==='workedDay'?'<div class="grid"><label>Data inicial dos dias trabalhados<input id="workedFrom" type="date" min="'+month()+'-01" max="'+month()+'-'+count+'"></label><label>Data final dos dias trabalhados<input id="workedTo" type="date" min="'+month()+'-01" max="'+month()+'-'+count+'"></label><button id="workedRange" type="button">Selecionar dias do intervalo</button><small>Inclui as duas datas e todos os dias entre elas. Desmarque folgas e dias não trabalhados antes de salvar. A seleção anterior será mantida.</small><p id="workedRangeFeedback" class="wide" role="status"></p></div>':'';
  return '<details class="wide"><summary>'+esc(label)+'</summary>'+range+'<div class="grid">'+Array.from({length:count},(_,i)=>{
    const date=month()+'-'+String(i+1).padStart(2,'0');
    return '<label><input type="checkbox" name="'+name+'" value="'+date+'" '+(chosen.has(date)?'checked':'')+'> '+String(i+1).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'</label>';
  }).join('')+'</div></details>';
}
function renderKpis(){
  const existing=selectedRecords().find(r=>r.category==='KPIs'), saved=existing?.details.manualAssessment;
  const chosen=new Set(String(existing?.details.plates||'').split(/[,;\s]+/).map(p=>p.replace(/[^a-z0-9]/ig,'').toUpperCase()));
  $('content').innerHTML='<section><h2>Bonificação — informações do período</h2><p>Não é necessário importar planilhas. Responda às perguntas e informe as datas quando houver ocorrências. Escolha a fonte do checklist: Epicollect5 ou lançamento manual. Registre em Utilização o período em que este motorista foi responsável pelo veículo.</p><small>A circulação fora do horário sem autorização pode eliminar os KPIs. Os cálculos permanecem provisórios até a aprovação humana.</small><form id="kpis"><label class="wide">Veículos utilizados<select name="plates" multiple size="4" required>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'" '+(chosen.has(v.plate)?'selected':'')+'>'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select><small>Selecione o veículo; para vários no computador, mantenha Ctrl pressionado.</small></label>'+bonusDateChoices('Selecione os dias realmente trabalhados','workedDay',existing?.details.workedDates||'')+bonusDateChoices('Selecione as datas em que a lavagem era exigida','washDay',existing?.details.washDates||'')+'<section class="wide"><label>Fonte do checklist<select name="checklistSource"><option value="Epicollect5">Buscar no Epicollect5</option><option value="Manual">Lançar manualmente</option></select></label><small>Você pode escolher Manual em qualquer competência, inclusive após o início do uso do aplicativo. A fonte fica registrada.</small><div id="manualChecklist" hidden><p>Adicione somente os dias e veículos com checklist efetivamente realizado. Não marcar um dia não equivale a checklist realizado.</p>'+bulkChecklistMarkup()+'<div data-rows="Checklist"></div><button id="addChecklistDate" type="button">Adicionar dia de checklist</button><label>Justificativa do checklist manual<textarea name="checklistReason" rows="2">'+esc(existing?.details.checklistSelection?.justification||'')+'</textarea></label><label><input name="checklistReviewed" type="checkbox"> Conferi os checklists manuais e confirmo os dias e veículos informados.</label></div></section>'+Object.entries(manualQuestions).map(([category,question])=>'<section class="wide"><label>'+esc(question)+'<select data-answer="'+esc(category)+'" required><option value="">Selecione</option><option>Não</option><option>Sim</option></select></label><div data-dates="'+esc(category)+'" hidden><p>Informe as datas e veículos. Use uma linha para cada data/veículo.</p><div data-rows="'+esc(category)+'"></div><button type="button" data-add-date="'+esc(category)+'">Adicionar data</button></div></section>').join('')+input('Observações / justificativa da avaliação','justification','text',false,existing?.justification||'')+'<label class="wide"><input name="manualReviewed" type="checkbox" required> Conferi as informações deste motorista, veículos e competência. Confirmo as respostas e datas informadas.</label><button class="wide">'+(existing?'Recalcular avaliação não aprovada':'Salvar avaliação provisória')+'</button></form></section>';
  const form=$('kpis');
  bindWorkedRange(form);
  const checklistSource=existing?.details.checklistSelection;
  form.elements.checklistSource.value=checklistSource?.source||'Epicollect5';
  (checklistSource?.categories?.Checklist?.rows||[]).forEach(row=>addManualBonusDate('Checklist',row));
  const updateChecklist=()=>{
    const manual=form.elements.checklistSource.value==='Manual';
    $('manualChecklist').hidden=!manual;
    $('manualChecklist').querySelectorAll('input,select,textarea,button').forEach(field=>field.disabled=!manual);

    form.elements.checklistReviewed.required=manual;
  };
  form.elements.checklistSource.onchange=()=>{
    form.elements.checklistReviewed.checked=false;
    if(form.elements.checklistSource.value==='Manual'&&!form.querySelector('[data-rows="Checklist"]').children.length)addManualBonusDate('Checklist');
    updateChecklist();
  };
  $('addChecklistDate').onclick=()=>addManualBonusDate('Checklist');
  bindBulkChecklist();
  updateChecklist();
  Object.keys(manualQuestions).forEach(category=>{
    const answer=form.querySelector('[data-answer="'+category+'"]'), dates=form.querySelector('[data-dates="'+category+'"]'), rows=form.querySelector('[data-rows="'+category+'"]');
    const update=()=>{
      dates.hidden=answer.value!=='Sim';
      rows.querySelectorAll('input,select,textarea').forEach(field=>{field.disabled=answer.value!=='Sim';});
      if(answer.value==='Sim'&&!rows.children.length)addManualBonusDate(category);
    };

    if(saved?.categories?.[category]){
      answer.value=saved.categories[category].answer;

  form.onsubmit=e=>{
    e.preventDefault();

    const newFiles=Array.from(form.querySelectorAll('[data-field="file"]')).filter(field=>!field.disabled).map(field=>field.files[0]).filter(Boolean);

      values.checklist.reviewed=form.elements.checklistReviewed.checked;

      values.checklist.rows=await Promise.all(Array.from(form.querySelector('[data-rows="Checklist"]').children).map(readManualBonusDate));
    }
    values.manualAssessment={reviewed:form.elements.manualReviewed.checked,categories:Object.fromEntries(await Promise.all(Object.keys(manualQuestions).map(async category=>{
      const answer=form.querySelector('[data-answer="'+category+'"]').value;

      return [category,{answer,rows}];

function bulkChecklistMarkup(){
  const [year,m]=month().split('-').map(Number), count=new Date(year,m,0).getDate();
  return '<details class="wide"><summary>Lançar vários dias de uma vez</summary><div class="grid"><label>Veículo para os dias selecionados<select id="bulkChecklistPlate"><option value="">Selecione</option>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'">'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select></label><label>Detalhes comuns (opcional)<input id="bulkChecklistDescription"></label><label>Data inicial do lote<input id="bulkChecklistFrom" type="date"></label><label>Data final do lote<input id="bulkChecklistTo" type="date"></label><div class="actions wide"><button id="bulkChecklistRange" type="button">Selecionar intervalo</button><button id="bulkChecklistWorked" type="button">Marcar dias trabalhados</button><button id="bulkChecklistClear" type="button">Limpar seleção</button></div><small class="wide">Marque apenas os dias com checklist realizado. Os atalhos usam somente os dias trabalhados selecionados acima. A adição não salva nem aprova a bonificação.</small><div class="wide" style="display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px">'+Array.from({length:count},(_,i)=>{const day=String(i+1).padStart(2,'0'),date=month()+'-'+day;return '<label style="text-align:center"><input type="checkbox" name="bulkChecklistDay" value="'+date+'" aria-label="Checklist '+day+'/'+String(m).padStart(2,'0')+'"> '+day+'</label>';}).join('')+'</div><button id="bulkChecklistAdd" type="button" class="wide">Adicionar dias selecionados</button><p id="bulkChecklistFeedback" class="wide" role="status"></p></div></details>';
}
function planChecklistBatch(existing,dates,plate,workedDates,competence){
  if(!plate)throw Error('Selecione o veículo para os dias do lote.');
  const unique=[...new Set(dates)].sort();
  if(!unique.length)throw Error('Marque pelo menos um dia para adicionar.');
  if(unique.some(date=>!/^\d{4}-\d{2}-\d{2}$/.test(date)||date.slice(0,7)!==competence||!workedDates.includes(date)))throw Error('Os dias do lote devem estar entre os dias trabalhados desta competência.');
  const normalize=value=>String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  const seen=new Set(existing.map(row=>row.date+'|'+normalize(row.plate))),add=[];
  unique.forEach(date=>{const key=date+'|'+normalize(plate);if(!seen.has(key)){seen.add(key);add.push({date,plate});}});
  return {add,duplicates:unique.length-add.length};
}
function checklistBatchRange(competence,from,to,workedDates){
  const valid=date=>/^\d{4}-\d{2}-\d{2}$/.test(date)&&date.slice(0,7)===competence&&Number.isFinite(new Date(date+'T12:00:00Z').getTime())&&new Date(date+'T12:00:00Z').toISOString().slice(0,10)===date;
  if(!valid(from)||!valid(to)||from>to)throw Error('Informe um intervalo válido dentro da competência selecionada.');
  const dates=workedDates.filter(date=>date>=from&&date<=to);
  if(!dates.length)throw Error('Não há dias trabalhados selecionados nesse intervalo.');
  return dates;
}
function bindBulkChecklist(){
  const form=$('kpis'),feedback=$('bulkChecklistFeedback'),worked=()=>Array.from(form.querySelectorAll('[name="workedDay"]:checked')).map(field=>field.value),fields=()=>Array.from(form.querySelectorAll('[name="bulkChecklistDay"]'));
  const select=dates=>fields().forEach(field=>field.checked=dates.includes(field.value));
  const action=fn=>()=>{try{fn();}catch(error){feedback.textContent=error.message||String(error);}};
  $('bulkChecklistRange').onclick=action(()=>{select(checklistBatchRange(month(),$('bulkChecklistFrom').value,$('bulkChecklistTo').value,worked()));feedback.textContent='Intervalo selecionado. Confira os dias e clique em Adicionar dias selecionados.';});
  $('bulkChecklistWorked').onclick=action(()=>{const days=worked();if(!days.length)throw Error('Selecione primeiro os dias realmente trabalhados.');select(days);feedback.textContent='Dias trabalhados marcados. Desmarque os que não tiveram checklist antes de adicionar.';});
  $('bulkChecklistClear').onclick=()=>{select([]);feedback.textContent='Seleção limpa; os registros já adicionados foram mantidos.';};
  $('bulkChecklistAdd').onclick=action(()=>{
    const container=form.querySelector('[data-rows="Checklist"]'),rows=Array.from(container.children),plate=$('bulkChecklistPlate').value;
    if(!Array.from(form.elements.plates.selectedOptions).some(option=>option.value===plate))throw Error('Selecione esse veículo também em Veículos utilizados.');
    const result=planChecklistBatch(rows.map(row=>({date:row.querySelector('[data-field="date"]').value,plate:row.querySelector('[data-field="plate"]').value})),fields().filter(field=>field.checked).map(field=>field.value),plate,worked(),month());
    if(result.add.length){
      rows.filter(row=>!row.querySelector('[data-field="date"]').value&&!row.querySelector('[data-field="plate"]').value&&!row.querySelector('[data-field="description"]').value.trim()&&!row.querySelector('[data-field="file"]').files.length&&row.dataset.keepEvidence!=='true').forEach(row=>row.remove());
      result.add.forEach(row=>addManualBonusDate('Checklist',{...row,description:$('bulkChecklistDescription').value,compact:true}));
      form.elements.checklistReviewed.checked=false;form.elements.manualReviewed.checked=false;
    }
    feedback.textContent=result.add.length+' dia(s) adicionado(s); '+result.duplicates+' já existente(s) ignorado(s). Confira os registros antes de salvar a avaliação.';
  });
}
async function readManualBonusDate(row){
  return {date:row.querySelector('[data-field="date"]').value,plate:row.querySelector('[data-field="plate"]').value,description:row.querySelector('[data-field="description"]').value,file:await fileData(row.querySelector('[data-field="file"]').files[0]),keepEvidence:row.dataset.keepEvidence==='true'};

  row.querySelector('button').onclick=()=>row.remove();
  if(category==='Checklist'&&values.compact){
    const content=row.innerHTML;row.innerHTML='<details class="wide"><summary>'+esc(values.date.split('-').reverse().join('/')+' — '+values.plate)+'</summary><div class="grid">'+content+'</div></details>';
    row.querySelector('button').onclick=()=>row.remove();
  }
  $('kpis').querySelector('[data-rows="'+category+'"]').appendChild(row);
}
function bonusRangeInfo(from,to,competence=''){
  const valid=value=>/^\d{4}-\d{2}-\d{2}$/.test(value)&&Number.isFinite(Date.parse(value+'T12:00:00Z'))&&new Date(value+'T12:00:00Z').toISOString().slice(0,10)===value;
  if(!valid(from)||!valid(to)||to<from)throw Error('Informe um intervalo válido: data final igual ou posterior à inicial.');
  if(competence&&(from.slice(0,7)!==competence||to.slice(0,7)!==competence))throw Error('Selecione dias dentro da competência atual.');
  return {from,to,count:Math.round((Date.parse(to+'T12:00:00Z')-Date.parse(from+'T12:00:00Z'))/86400000)+1};
}
function workedRangeDates(competence,from,to){
  const range=bonusRangeInfo(from,to,competence),start=Date.parse(from+'T12:00:00Z');
  return Array.from({length:range.count},(_,i)=>new Date(start+i*86400000).toISOString().slice(0,10));
}
function bindWorkedRange(form){
  $('workedRange').onclick=()=>{

      const dates=new Set(workedRangeDates(month(),$('workedFrom').value,$('workedTo').value));

      form.elements.checklistReviewed.checked=false;form.elements.manualReviewed.checked=false;
      $('workedRangeFeedback').textContent=dates.size+' dia(s) selecionado(s) no intervalo. Confira e desmarque folgas ou dias não trabalhados. Nada foi salvo.';
    }catch(error){$('workedRangeFeedback').textContent=error.message;}
  };
}
