<!doctype html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:white;color:#183f2d;font:15px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1,h2,h3{color:#1f7a46}header{border-bottom:1px solid #cfe8d5;padding-bottom:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,a.button{background:#1f7a46;color:white;border:0;border-radius:6px;padding:11px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #b8d7c2;border-radius:5px;padding:10px;font:inherit;background:white}[hidden]{display:none!important}label{display:block;font-size:13px}form,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}section{border:1px solid #cfe8d5;border-radius:10px;padding:18px;margin:18px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{background:#f2f9f4}.scroll{overflow:auto}small{display:block;color:#5b7467;margin:6px 0}.notice{background:#fff9e8;border:1px solid #e8d597;padding:12px;margin:14px 0;border-radius:6px}#message{white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-word;font:13px Arial}details{margin:12px 0}a{color:#1f7a46}.actions{display:flex;gap:8px;flex-wrap:wrap}input[type=checkbox]{width:auto}h3{font-size:16px}@media(max-width:650px){form,.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main><header><h1>Bonificações dos Motoristas</h1><p>Painel Gerencial de Frotas · AGROMIG · área operacional restrita</p><small>Conta autorizada: frota@agromig.com.br. Sem aprovação humana, nenhum valor se torna definitivo e nenhum relatório é enviado.</small></header>
<p id="message" role="status">Carregando cadastro e histórico…</p><div class="grid"><label>Motorista<select id="driver"></select></label><label>Competência<input id="month" type="month"></label></div><nav id="nav"></nav><div id="content"></div></main>
<script>
let state=null, page='Registros', request=0, importPreview=null;
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), brl=c=>c==null?'Não disponível':(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
const message=text=>$('message').textContent=text;
async function run(task,success='Operação concluída.'){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await task();message(success);return result}catch(error){message(error.message||String(error));return null}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const ticket=++request;try{const next=await call('getDriverBonusesState');if(ticket!==request)return;state=next;const previous=$('driver').value;$('driver').innerHTML=state.drivers.map(d=>'<option>'+esc(d.name)+'</option>').join('');if(state.drivers.some(d=>d.name===previous))$('driver').value=previous;message('Cadastro atualizado. Matrícula e cargo não disponíveis na fonte atual.');render()}catch(error){message(error.message||String(error))}}
const input=(label,name,type='text',required=true,value='')=>'<label>'+esc(label)+'<input name="'+name+'" type="'+type+'" '+(type==='number'?'step="any" ':'')+(required?'required ':'')+'value="'+esc(value)+'"></label>';
const fileInput=()=>'<label class="wide">Documento original (JPG, PNG ou PDF)<input name="file" type="file" accept="image/jpeg,image/png,application/pdf"></label>';
const vehicleSelect=()=>'<label>Veículo / placa<select name="plate" required>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'">'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select></label>';
const driver=()=>$('driver').value, month=()=>$('month').value;
const selectedRecords=()=>state.records.filter(r=>r.driver===driver()&&r.month===month());
async function fileData(file){if(!file||!file.size)return null;if(file.size>8*1024*1024)throw Error('Arquivo deve ter até 8 MB.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mimeType:file.type||(/\.xlsx$/i.test(file.name)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/vnd.ms-excel'),base64:String(reader.result).split(',')[1]});reader.onerror=reject;reader.readAsDataURL(file)})}
function bindForm(id,fn){$(id).onsubmit=e=>{e.preventDefault();const form=e.target;run(async()=>{await fn(Object.fromEntries(new FormData(form)),form);await load()})}}
function render(){if(!state)return;const tabs=['Registros','Nova viagem','Cargo de confiança','KPIs','Utilização','Lavagem e multas','Relatórios e e-mails','Configurações'];$('nav').innerHTML=tabs.map(t=>'<button data-page="'+esc(t)+'" aria-pressed="'+(t===page)+'">'+esc(t)+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
if(page==='Registros')renderRecords();else if(page==='Nova viagem')renderTrip();else if(page==='Cargo de confiança')renderTrust();else if(page==='KPIs')renderKpis();else if(page==='Utilização')renderAssignments();else if(page==='Lavagem e multas')renderOperations();else if(page==='Relatórios e e-mails')renderReports();else renderConfig();}
function renderRecords(){const rows=selectedRecords();$('content').innerHTML='<section><h2>Histórico individual</h2><p>'+esc(driver())+' · '+esc(month())+'</p><p>Viagens aprovadas: '+brl(rows.filter(r=>r.category==='Viagem'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+' · Cargo aprovado: '+brl(rows.filter(r=>r.category==='Cargo de confiança'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+' · KPIs aprovados: '+brl(rows.filter(r=>r.category==='KPIs'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+'</p><div class="scroll"><table><tr><th>Categoria</th><th>Valor provisório / aprovado</th><th>Status</th><th>Documentos e histórico</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.category)+'</td><td>'+brl(r.calculation.cents)+' / '+(r.approved?brl(r.approved.cents):'Não aprovado')+'</td><td>'+esc(r.status)+'</td><td><details><summary>Consultar</summary><pre>'+esc(JSON.stringify({detalhes:r.details,calculo:r.calculation,justificativa:r.justification,historico:r.actions},null,2))+'</pre>'+(r.evidence?'<a href="'+esc(r.evidence.url)+'" target="_blank" rel="noopener">Abrir / baixar original no Drive</a>':'Sem documento anexado')+'</details><div class="actions"><button data-transition="'+esc(r.id)+'">Alterar status</button><button data-attach="'+esc(r.id)+'">Anexar documento</button></div></td></tr>').join('')+'</table></div>'+(rows.length?'':'<p>Nenhum registro nesta competência.</p>')+'</section><div id="statusEditor"></div>';
$('content').querySelectorAll('[data-transition]').forEach(b=>b.onclick=()=>openStatusEditor(state.records.find(r=>r.id===b.dataset.transition)));
$('content').querySelectorAll('[data-attach]').forEach(b=>b.onclick=()=>{const field=document.createElement('input');field.type='file';field.accept='image/jpeg,image/png,application/pdf';field.onchange=()=>run(async()=>{await call('addBonusEvidence',b.dataset.attach,await fileData(field.files[0]));await load()});field.click()});}
function openStatusEditor(record){
  if(!record)return;
  const next=record.nextStatuses||[], blockers=record.approvalBlockers||[];
  $('statusEditor').innerHTML='<section aria-labelledby="statusTitle"><h2 id="statusTitle">Alterar status do registro</h2><p>'+esc(record.category)+' · '+esc(record.driver)+' · '+esc(record.month)+'</p><p>Status atual: <strong>'+esc(record.status)+'</strong></p><small>Fluxo de aprovação: Em análise → Aguardando aprovação → Aprovado. Cada etapa fica registrada no histórico.</small>'+(blockers.length?'<div class="notice"><strong>Pendências que impedem a aprovação</strong><ul>'+blockers.map(reason=>'<li>'+esc(reason)+'</li>').join('')+'</ul><p>Anexe os documentos ou recalcule os KPIs depois de resolver as pendências.</p></div>':'')+'<form id="statusForm"><label>Próximo status<select name="status" required><option value="">Selecione a próxima etapa</option>'+next.map(status=>'<option>'+esc(status)+'</option>').join('')+'</select></label><label>Justificativa da alteração<textarea name="justification" required rows="3"></textarea></label><label class="wide" id="approvalReview" hidden><input name="reviewed" type="checkbox"> Conferi os dados, cálculos, responsabilidade e documentos deste registro e confirmo a aprovação.</label><p class="wide" id="statusFeedback" role="status"></p><div class="actions wide"><button type="submit">Salvar alteração de status</button><button id="cancelStatus" type="button">Cancelar</button></div></form></section>';
  const form=$('statusForm'), feedback=$('statusFeedback');
  form.elements.status.onchange=()=>{
    const approving=form.elements.status.value==='Aprovado';
    $('approvalReview').hidden=!approving;
    form.elements.reviewed.required=approving;
    form.elements.reviewed.checked=false;
    feedback.textContent=approving&&blockers.length?'Aprovação bloqueada: resolva as pendências indicadas acima.':'';
  };
  $('cancelStatus').onclick=()=>{$('statusEditor').innerHTML='';};
  form.onsubmit=e=>{
    e.preventDefault();
    const status=form.elements.status.value, reason=form.elements.justification.value.trim(), reviewed=form.elements.reviewed.checked;
    if(!status||!reason){feedback.textContent='Selecione a próxima etapa e informe uma justificativa.';return;}
    if(status==='Aprovado'&&(blockers.length||!reviewed)){feedback.textContent=blockers.length?'Aprovação bloqueada: resolva as pendências indicadas acima.':'Confirme a conferência antes de aprovar.';return;}
    run(async()=>{
      try{
        const updated=await call('transitionDriverBonus',record.id,status,reason,reviewed,record.status);
        await load();
      }catch(error){feedback.textContent=error.message||String(error);throw error;}
    },'Status atualizado para '+status+'. Histórico preservado.');
  };
  form.elements.status.focus();
}
function renderTrip(){$('content').innerHTML='<section><h2>Bonificação por viagem</h2><form id="trip">'+vehicleSelect()+input('Número da requisição','request')+input('Data da viagem','date','date')+input('Origem','origin')+input('Destino','destination')+input('KM inicial','initialKm')+input('KM final','finalKm')+'<p id="tripPreview">Tarifa padrão: R$ 0,90/KM. O servidor aplica a regra vigente na competência.</p>'+input('Observações','notes','text',false)+fileInput()+'<button class="wide">Salvar rascunho</button></form></section>';
bindForm('trip',async values=>call('saveDriverBonus',{...values,driver:driver(),month:month(),category:'Viagem',file:await fileData(values.file)}));
$('trip').oninput=()=>{const start=Number($('trip').elements.initialKm.value.replace(',','.')),end=Number($('trip').elements.finalKm.value.replace(',','.'));$('tripPreview').textContent=Number.isFinite(start)&&end>start?(end-start).toLocaleString('pt-BR')+' KM — calculado no servidor ao salvar':'Informe KM final maior que o inicial.'}}
function renderTrust(){$('content').innerHTML='<section><h2>Cargo de confiança</h2><p>Concessão individual · padrão R$ 1.000,00 por competência. Nunca concedido automaticamente.</p><form id="trust">'+input('Justificativa','justification')+input('Autorização / referência','authorization')+fileInput()+'<button class="wide">Salvar rascunho</button></form></section>';bindForm('trust',async values=>call('saveDriverBonus',{...values,driver:driver(),month:month(),category:'Cargo de confiança',file:await fileData(values.file)}))}
const manualQuestions={'Circulação':'Houve circulação fora do horário autorizado?','Velocidade':'Houve excesso do limite de velocidade aplicável?','Lavagem':'Foram realizadas lavagens?','Multas':'Houve multas?'};
function bonusDateChoices(label,name,selected=''){
  const [year,m]=month().split('-').map(Number), count=new Date(year,m,0).getDate(), chosen=new Set(selected.split(/[,;\s]+/));
  return '<details class="wide"><summary>'+esc(label)+'</summary><div class="grid">'+Array.from({length:count},(_,i)=>{
    const date=month()+'-'+String(i+1).padStart(2,'0');
    return '<label><input type="checkbox" name="'+name+'" value="'+date+'" '+(chosen.has(date)?'checked':'')+'> '+String(i+1).padStart(2,'0')+'/'+String(m).padStart(2,'0')+'</label>';
  }).join('')+'</div></details>';
}
function renderKpis(){
  const existing=selectedRecords().find(r=>r.category==='KPIs'), saved=existing?.details.manualAssessment;
  const chosen=new Set(String(existing?.details.plates||'').split(/[,;\s]+/).map(p=>p.replace(/[^a-z0-9]/ig,'').toUpperCase()));
  $('content').innerHTML='<section><h2>Bonificação — informações do período</h2><p>Não é necessário importar planilhas. Responda às perguntas e informe as datas quando houver ocorrências. O checklist vem diretamente do Epicollect5. Registre em Utilização o período em que este motorista foi responsável pelo veículo.</p><small>A circulação fora do horário sem autorização pode eliminar os KPIs. Os cálculos permanecem provisórios até a aprovação humana.</small><form id="kpis"><label class="wide">Veículos utilizados<select name="plates" multiple size="4" required>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'" '+(chosen.has(v.plate)?'selected':'')+'>'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select><small>Selecione o veículo; para vários no computador, mantenha Ctrl pressionado.</small></label>'+bonusDateChoices('Selecione os dias realmente trabalhados','workedDay',existing?.details.workedDates||'')+bonusDateChoices('Selecione as datas em que a lavagem era exigida','washDay',existing?.details.washDates||'')+Object.entries(manualQuestions).map(([category,question])=>'<section class="wide"><label>'+esc(question)+'<select data-answer="'+esc(category)+'" required><option value="">Selecione</option><option>Não</option><option>Sim</option></select></label><div data-dates="'+esc(category)+'" hidden><p>Informe as datas e veículos. Use uma linha para cada data/veículo.</p><div data-rows="'+esc(category)+'"></div><button type="button" data-add-date="'+esc(category)+'">Adicionar data</button></div></section>').join('')+input('Observações / justificativa da avaliação','justification','text',false,existing?.justification||'')+'<label class="wide"><input name="manualReviewed" type="checkbox" required> Conferi as informações deste motorista, veículos e competência. Confirmo as respostas e datas informadas.</label><button class="wide">'+(existing?'Recalcular avaliação não aprovada':'Salvar avaliação provisória')+'</button></form></section>';
  const form=$('kpis');
  Object.keys(manualQuestions).forEach(category=>{
    const answer=form.querySelector('[data-answer="'+category+'"]'), dates=form.querySelector('[data-dates="'+category+'"]'), rows=form.querySelector('[data-rows="'+category+'"]');
    const update=()=>{
      dates.hidden=answer.value!=='Sim';
      rows.querySelectorAll('input,select,textarea').forEach(field=>{field.disabled=answer.value!=='Sim';});
      if(answer.value==='Sim'&&!rows.children.length)addManualBonusDate(category);
    };
    answer.onchange=update;
    form.querySelector('[data-add-date="'+category+'"]').onclick=()=>addManualBonusDate(category);
    if(saved?.categories?.[category]){
      answer.value=saved.categories[category].answer;
      saved.categories[category].rows.forEach(row=>addManualBonusDate(category,row));
    }
    update();
  });
  form.onsubmit=e=>{
    e.preventDefault();
    const values={plates:Array.from(form.elements.plates.selectedOptions).map(o=>o.value).join(','),workedDates:Array.from(form.querySelectorAll('[name="workedDay"]:checked')).map(i=>i.value).join(','),washDates:Array.from(form.querySelectorAll('[name="washDay"]:checked')).map(i=>i.value).join(','),justification:form.elements.justification.value};
    values.manualAssessment={reviewed:form.elements.manualReviewed.checked,categories:Object.fromEntries(Object.keys(manualQuestions).map(category=>{
      const answer=form.querySelector('[data-answer="'+category+'"]').value;
      const rows=answer==='Sim'?Array.from(form.querySelector('[data-rows="'+category+'"]').children).map(row=>({date:row.querySelector('[data-field="date"]').value,plate:row.querySelector('[data-field="plate"]').value,description:row.querySelector('[data-field="description"]').value,authorized:row.querySelector('[data-field="authorized"]')?.checked===true,contested:row.querySelector('[data-field="contested"]')?.checked===true})):[];
      return [category,{answer,rows}];
    }))};
    run(async()=>{
      await call(existing?'reevaluateBonus':'saveDriverBonus',...(existing?[existing.id,values]:[{...values,driver:driver(),month:month(),category:'KPIs'}]));
      await load();
    });
  };
}
function addManualBonusDate(category,values={}){
  const row=document.createElement('div');row.className='grid';row.style.marginBottom='16px';
  row.innerHTML='<label>Data<input data-field="date" type="date" min="'+month()+'-01" max="'+month()+'-'+String(new Date(Number(month().slice(0,4)),Number(month().slice(5)),0).getDate()).padStart(2,'0')+'" required value="'+esc(values.date||'')+'"></label><label>Veículo<select data-field="plate" required><option value="">Selecione</option>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'" '+(v.plate===values.plate?'selected':'')+'>'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select></label><label class="wide">Detalhes (opcional)<textarea data-field="description" rows="2">'+esc(values.description||'')+'</textarea></label>'+(category==='Circulação'?'<label class="wide"><input data-field="authorized" type="checkbox" '+(values.authorized?'checked':'')+'> A circulação fora do horário tinha autorização / exceção válida</label>':'')+(category==='Multas'?'<label class="wide"><input data-field="contested" type="checkbox" '+(values.contested?'checked':'')+'> Multa contestada — manter pendente para análise</label>':'')+'<button type="button">Remover esta data</button>';
  row.querySelector('button').onclick=()=>row.remove();
  $('kpis').querySelector('[data-rows="'+category+'"]').appendChild(row);
}
function renderAssignments(){$('content').innerHTML='<section><h2>Responsabilidade pelos veículos</h2><p>Não usa o motorista atual do Cadastro como prova histórica. Informe apenas períodos comprovados.</p><form id="assignment">'+vehicleSelect()+input('Início','from','date')+input('Final','to','date')+input('Justificativa / referência da atribuição','justification')+'<button>Registrar período</button></form><pre>'+esc(JSON.stringify(state.assignments.filter(r=>r.driver===driver()),null,2))+'</pre></section>';bindForm('assignment',values=>call('saveBonusAssignment',{...values,driver:driver()}))}
function renderOperations(){const rows=state.operations.filter(r=>r.driver===driver()&&r.date?.slice(0,7)===month());$('content').innerHTML='<section><h2>Lavagem e multas</h2><form id="operation"><label>Categoria<select name="category"><option>Lavagem</option><option>Multas</option></select></label>'+vehicleSelect()+input('Data','date','date')+input('Horário (para multa)','time','time',false)+input('Tipo / descrição','description')+input('Local','location','text',false)+input('Número da infração (para multa)','infraction','text',false)+input('Valor da multa','value','text',false)+input('Observações','notes','text',false)+fileInput()+'<button class="wide">Salvar para análise</button></form><h3>Ocorrências do período</h3>'+rows.map(r=>'<details><summary>'+esc(r.category+' — '+r.plate+' — '+r.date)+'</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre><button data-review="'+r.id+'">Revisar atribuição / exceção / contestação</button></details>').join('')+'</section>';bindForm('operation',async values=>call('saveBonusOperation',{...values,driver:driver(),month:month(),file:await fileData(values.file)}));$('content').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const decision=prompt('Confirmada, Contestada, Exceção autorizada ou Pendente');const reason=decision&&prompt('Justificativa e referência da comprovação:');if(reason)run(async()=>{await call('reviewBonusOperation',b.dataset.review,decision,reason);await load()})})}
function renderReports(){const reports=state.reports.filter(r=>r.month===month());$('content').innerHTML='<section><h2>Relatórios da competência</h2><p>Agendamento: '+(state.schedulerEnabled?'ativo · dia 10, aproximadamente às 08h, America/Sao_Paulo':'desativado')+'</p><p>Os quatro anexos precisam ser conferidos antes de cada envio. Valores pendentes não compõem o total aprovado. Nenhum e-mail é enviado só por gerar o relatório.</p><button id="prepareReport">Gerar PDF e Excel para conferência</button>'+reports.map(r=>'<details><summary>'+esc(r.month+' — '+r.status)+'</summary><p>Destinatários: '+esc(r.recipients.join(', '))+'</p><h3>'+esc(r.subject)+'</h3><pre>'+esc(r.body)+'</pre>'+r.files.map(f=>'<p><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.name)+'</a></p>').join('')+(r.status==='Aguardando conferência'?'<button data-approve-report="'+r.id+'">Registrar conferência e liberar envio</button>':'')+'</details>').join('')+'<div class="actions"><button id="enableMail">Ativar agendamento mensal</button><button id="disableMail">Desativar agendamento</button><button id="sendMail">Enviar relatório já conferido</button></div><h2>Histórico de E-mails de Bonificação</h2><pre>'+esc(JSON.stringify(state.mailHistory.filter(r=>r.month===month()),null,2))+'</pre></section>';$('prepareReport').onclick=()=>run(async()=>{await call('prepareBonusReport',month());await load()});$('content').querySelectorAll('[data-approve-report]').forEach(b=>b.onclick=()=>{const checked=confirm('Você abriu e conferiu os quatro anexos e o conteúdo do e-mail? A liberação permitirá envio aos quatro destinatários indicados.');const reason=checked&&prompt('Registre a conclusão da conferência:');if(reason)run(async()=>{await call('approveBonusReport',b.dataset.approveReport,reason,true);await load()})});$('enableMail').onclick=()=>{if(confirm('Ativar envio no dia 10, por volta das 08h, de relatórios previamente conferidos? O Google poderá solicitar novas permissões.'))run(async()=>{await call('configureBonusMonthlyEmail',true);await load()})};$('disableMail').onclick=()=>run(async()=>{await call('configureBonusMonthlyEmail',false);await load()});$('sendMail').onclick=()=>{if(confirm('Enviar agora o relatório desta competência previamente conferido aos quatro destinatários corporativos?'))run(async()=>{const result=await call('sendReviewedBonusReport',month());if(result.sent===false)throw Error(result.reason);await load()})}}
function renderConfig(){const latest=state.ruleVersions.at(-1);$('content').innerHTML='<section><h2>Configurações por vigência</h2><p>Não altera competências já registradas. Valores monetários em reais. A aprovação humana e a conferência de cada e-mail são obrigatórias. Destinatários e remetente seguem os endereços autorizados pelo gestor.</p><form id="config">'+input('Vigência inicial','from','month')+Object.entries(latest.rules).filter(([key])=>!['sendDay','sendHour','washEveryDays'].includes(key)).map(([key,value])=>input(({kmCents:'Tarifa por KM (R$)',trustCents:'Cargo de confiança (R$)',checklistCents:'Checklist (R$)',circulationCents:'Circulação (R$)',speedCents:'Velocidade (R$)',washCents:'Lavagem (R$)',finesCents:'Multas (R$)',allowedStart:'Horário inicial autorizado',allowedEnd:'Horário final autorizado',carLimit:'Limite de carros/caminhonetes (KM/H)',busLimit:'Limite de ônibus/micro-ônibus (KM/H)',otherLimit:'Limite dos demais veículos (KM/H)'})[key]||key,key,typeof value==='number'?'number':'text',true,key.endsWith('Cents')?value/100:value)).join('')+'<button class="wide">Salvar vigência futura</button></form><pre>'+esc(JSON.stringify(state.ruleVersions,null,2))+'</pre></section>';bindForm('config',values=>{const rules={...latest.rules};Object.keys(rules).forEach(key=>{if(values[key]!==undefined)rules[key]=key.endsWith('Cents')?Math.round(Number(values[key])*100):typeof rules[key]==='number'?Number(values[key]):values[key]});return call('saveBonusRules',{from:values.from,rules})})}
$('driver').onchange=()=>{importPreview=null;render()};$('month').onchange=()=>{importPreview=null;render()};const local=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit'}).format(new Date());$('month').value=local;load();
</script></body></html>
