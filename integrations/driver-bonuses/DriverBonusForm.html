<!doctype html><html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;background:white;color:#183f2d;font:15px Arial,sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1,h2,h3{color:#1f7a46}header{border-bottom:1px solid #cfe8d5;padding-bottom:14px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,a.button{background:#1f7a46;color:white;border:0;border-radius:6px;padding:11px;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #b8d7c2;border-radius:5px;padding:10px;font:inherit;background:white}label{display:block;font-size:13px}form,.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.wide{grid-column:1/-1}section{border:1px solid #cfe8d5;border-radius:10px;padding:18px;margin:18px 0}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}th{background:#f2f9f4}.scroll{overflow:auto}small{display:block;color:#5b7467;margin:6px 0}.notice{background:#fff9e8;border:1px solid #e8d597;padding:12px;margin:14px 0;border-radius:6px}#message{white-space:pre-wrap}pre{white-space:pre-wrap;word-break:break-word;font:13px Arial}details{margin:12px 0}a{color:#1f7a46}.actions{display:flex;gap:8px;flex-wrap:wrap}input[type=checkbox]{width:auto}h3{font-size:16px}@media(max-width:650px){form,.grid{grid-template-columns:1fr}main{padding:12px}}
</style></head><body><main><header><h1>Bonificações dos Motoristas</h1><p>Painel Gerencial de Frotas · AGROMIG · área operacional restrita</p><small>Conta autorizada: frota@agromig.com.br. Sem aprovação humana, nenhum valor se torna definitivo e nenhum relatório é enviado.</small></header>
<p id="message" role="status">Carregando cadastro e histórico…</p><div class="grid"><label>Motorista<select id="driver"></select></label><label>Competência<input id="month" type="month"></label></div><nav id="nav"></nav><div id="content"></div></main>
<script>
let state=null, page='Registros', request=0, importPreview=null;
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), brl=c=>c==null?'Não disponível':(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const call=(name,...args)=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));
const message=text=>$('message').textContent=text;
async function run(task){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{const result=await task();message('Operação concluída.');return result}catch(error){message(error.message||String(error));return null}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){const ticket=++request;try{const next=await call('getDriverBonusesState');if(ticket!==request)return;state=next;const previous=$('driver').value;$('driver').innerHTML=state.drivers.map(d=>'<option>'+esc(d.name)+'</option>').join('');if(state.drivers.some(d=>d.name===previous))$('driver').value=previous;message('Cadastro atualizado. Matrícula e cargo não disponíveis na fonte atual.');render()}catch(error){message(error.message||String(error))}}
const input=(label,name,type='text',required=true,value='')=>'<label>'+esc(label)+'<input name="'+name+'" type="'+type+'" '+(type==='number'?'step="any" ':'')+(required?'required ':'')+'value="'+esc(value)+'"></label>';
const fileInput=()=>'<label class="wide">Documento original (JPG, PNG ou PDF)<input name="file" type="file" accept="image/jpeg,image/png,application/pdf"></label>';
const vehicleSelect=()=>'<label>Veículo / placa<select name="plate" required>'+state.vehicles.map(v=>'<option value="'+esc(v.plate)+'">'+esc(v.plate+' — '+v.model)+'</option>').join('')+'</select></label>';
const driver=()=>$('driver').value, month=()=>$('month').value;
const selectedRecords=()=>state.records.filter(r=>r.driver===driver()&&r.month===month());
async function fileData(file){if(!file||!file.size)return null;if(file.size>8*1024*1024)throw Error('Arquivo deve ter até 8 MB.');return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:file.name,mimeType:file.type||(/\.xlsx$/i.test(file.name)?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'application/vnd.ms-excel'),base64:String(reader.result).split(',')[1]});reader.onerror=reject;reader.readAsDataURL(file)})}
function bindForm(id,fn){$(id).onsubmit=e=>{e.preventDefault();const form=e.target;run(async()=>{await fn(Object.fromEntries(new FormData(form)),form);await load()})}}
function render(){if(!state)return;const tabs=['Registros','Nova viagem','Cargo de confiança','KPIs','Utilização','Lavagem e multas','Importação','Relatórios e e-mails','Configurações'];$('nav').innerHTML=tabs.map(t=>'<button data-page="'+esc(t)+'" aria-pressed="'+(t===page)+'">'+esc(t)+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});
if(page==='Registros')renderRecords();else if(page==='Nova viagem')renderTrip();else if(page==='Cargo de confiança')renderTrust();else if(page==='KPIs')renderKpis();else if(page==='Utilização')renderAssignments();else if(page==='Lavagem e multas')renderOperations();else if(page==='Importação')renderImports();else if(page==='Relatórios e e-mails')renderReports();else renderConfig();}
function renderRecords(){const rows=selectedRecords();$('content').innerHTML='<section><h2>Histórico individual</h2><p>'+esc(driver())+' · '+esc(month())+'</p><p>Viagens aprovadas: '+brl(rows.filter(r=>r.category==='Viagem'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+' · Cargo aprovado: '+brl(rows.filter(r=>r.category==='Cargo de confiança'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+' · KPIs aprovados: '+brl(rows.filter(r=>r.category==='KPIs'&&r.approved&&['Aprovado','Pago'].includes(r.status)).reduce((s,r)=>s+r.approved.cents,0))+'</p><div class="scroll"><table><tr><th>Categoria</th><th>Valor provisório / aprovado</th><th>Status</th><th>Documentos e histórico</th></tr>'+rows.map(r=>'<tr><td>'+esc(r.category)+'</td><td>'+brl(r.calculation.cents)+' / '+(r.approved?brl(r.approved.cents):'Não aprovado')+'</td><td>'+esc(r.status)+'</td><td><details><summary>Consultar</summary><pre>'+esc(JSON.stringify({detalhes:r.details,calculo:r.calculation,justificativa:r.justification,historico:r.actions},null,2))+'</pre>'+(r.evidence?'<a href="'+esc(r.evidence.url)+'" target="_blank" rel="noopener">Abrir / baixar original no Drive</a>':'Sem documento anexado')+'</details><div class="actions"><button data-transition="'+esc(r.id)+'">Alterar status</button><button data-attach="'+esc(r.id)+'">Anexar documento</button></div></td></tr>').join('')+'</table></div>'+(rows.length?'':'<p>Nenhum registro nesta competência.</p>')+'</section>';
$('content').querySelectorAll('[data-transition]').forEach(b=>b.onclick=()=>{const status=prompt('Status: Aguardando documentos, Em análise, Aguardando aprovação, Aprovado, Rejeitado, Pago');if(!status)return;const reason=prompt('Justificativa da decisão (obrigatória):');if(!reason)return;const reviewed=status!=='Aprovado'||confirm('Você conferiu os dados, cálculos, responsabilidade e documentos deste registro e confirma a aprovação?');if(!reviewed)return;run(async()=>{await call('transitionDriverBonus',b.dataset.transition,status,reason,reviewed);await load()})});
$('content').querySelectorAll('[data-attach]').forEach(b=>b.onclick=()=>{const field=document.createElement('input');field.type='file';field.accept='image/jpeg,image/png,application/pdf';field.onchange=()=>run(async()=>{await call('addBonusEvidence',b.dataset.attach,await fileData(field.files[0]));await load()});field.click()});}
function renderTrip(){$('content').innerHTML='<section><h2>Bonificação por viagem</h2><form id="trip">'+vehicleSelect()+input('Número da requisição','request')+input('Data da viagem','date','date')+input('Origem','origin')+input('Destino','destination')+input('KM inicial','initialKm')+input('KM final','finalKm')+'<p id="tripPreview">Tarifa padrão: R$ 0,90/KM. O servidor aplica a regra vigente na competência.</p>'+input('Observações','notes','text',false)+fileInput()+'<button class="wide">Salvar rascunho</button></form></section>';
bindForm('trip',async values=>call('saveDriverBonus',{...values,driver:driver(),month:month(),category:'Viagem',file:await fileData(values.file)}));
$('trip').oninput=()=>{const start=Number($('trip').elements.initialKm.value.replace(',','.')),end=Number($('trip').elements.finalKm.value.replace(',','.'));$('tripPreview').textContent=Number.isFinite(start)&&end>start?(end-start).toLocaleString('pt-BR')+' KM — calculado no servidor ao salvar':'Informe KM final maior que o inicial.'}}
function renderTrust(){$('content').innerHTML='<section><h2>Cargo de confiança</h2><p>Concessão individual · padrão R$ 1.000,00 por competência. Nunca concedido automaticamente.</p><form id="trust">'+input('Justificativa','justification')+input('Autorização / referência','authorization')+fileInput()+'<button class="wide">Salvar rascunho</button></form></section>';bindForm('trust',async values=>call('saveDriverBonus',{...values,driver:driver(),month:month(),category:'Cargo de confiança',file:await fileData(values.file)}))}
function renderKpis(){const existing=selectedRecords().find(r=>r.category==='KPIs');$('content').innerHTML='<section><h2>Avaliação de KPIs</h2><p>Informe as datas realmente trabalhadas, inclusive sábados quando aplicável. Não inclua folgas, férias ou ausências justificadas. A responsabilidade deve estar registrada em Utilização.</p><form id="kpis">'+input('Placas utilizadas, separadas por vírgula','plates','text',true,existing?.details.plates||'')+input('Datas trabalhadas (AAAA-MM-DD, separadas por vírgula)','workedDates','text',true,existing?.details.workedDates||'')+input('Datas de lavagem obrigatória','washDates','text',true,existing?.details.washDates||'')+input('Justificativa / definição da frequência de lavagem','justification')+'<div class="wide">'+['Circulação','Velocidade','Lavagem','Multas'].map(t=>'<label><input type="checkbox" name="coverage'+t+'"> Conferi a cobertura completa do relatório de '+esc(t)+' no período</label>').join('')+'<label><input type="checkbox" name="noFinesConfirmed"> Conferi e confirmo ausência de multas elegíveis no período (se aplicável)</label></div><button class="wide">'+(existing?'Recalcular avaliação não aprovada':'Salvar avaliação provisória')+'</button></form></section>';
bindForm('kpis',async values=>{values.coverage=Object.fromEntries(['Circulação','Velocidade','Lavagem','Multas'].map(t=>[t,values['coverage'+t]==='on']));values.noFinesConfirmed=values.noFinesConfirmed==='on';return call(existing?'reevaluateBonus':'saveDriverBonus',...(existing?[existing.id,values]:[{...values,driver:driver(),month:month(),category:'KPIs'}]))})}
function renderAssignments(){$('content').innerHTML='<section><h2>Responsabilidade pelos veículos</h2><p>Não usa o motorista atual do Cadastro como prova histórica. Informe apenas períodos comprovados.</p><form id="assignment">'+vehicleSelect()+input('Início','from','date')+input('Final','to','date')+input('Justificativa / referência da atribuição','justification')+'<button>Registrar período</button></form><pre>'+esc(JSON.stringify(state.assignments.filter(r=>r.driver===driver()),null,2))+'</pre></section>';bindForm('assignment',values=>call('saveBonusAssignment',{...values,driver:driver()}))}
function renderOperations(){const rows=state.operations.filter(r=>r.driver===driver()&&r.date?.slice(0,7)===month());$('content').innerHTML='<section><h2>Lavagem e multas</h2><form id="operation"><label>Categoria<select name="category"><option>Lavagem</option><option>Multas</option></select></label>'+vehicleSelect()+input('Data','date','date')+input('Horário (para multa)','time','time',false)+input('Tipo / descrição','description')+input('Local','location','text',false)+input('Número da infração (para multa)','infraction','text',false)+input('Valor da multa','value','text',false)+input('Observações','notes','text',false)+fileInput()+'<button class="wide">Salvar para análise</button></form><h3>Ocorrências do período</h3>'+rows.map(r=>'<details><summary>'+esc(r.category+' — '+r.plate+' — '+r.date)+'</summary><pre>'+esc(JSON.stringify(r,null,2))+'</pre><button data-review="'+r.id+'">Revisar atribuição / exceção / contestação</button></details>').join('')+'</section>';bindForm('operation',async values=>call('saveBonusOperation',{...values,driver:driver(),month:month(),file:await fileData(values.file)}));$('content').querySelectorAll('[data-review]').forEach(b=>b.onclick=()=>{const decision=prompt('Confirmada, Contestada, Exceção autorizada ou Pendente');const reason=decision&&prompt('Justificativa e referência da comprovação:');if(reason)run(async()=>{await call('reviewBonusOperation',b.dataset.review,decision,reason);await load()})})}
function renderImports(){$('content').innerHTML='<section><h2>Importação de relatórios Excel</h2><form id="import"><label>Categoria<select name="category">'+['Circulação','Velocidade','Lavagem','Multas','Utilização'].map(t=>'<option>'+t+'</option>').join('')+'</select></label><label>Arquivo Excel original<input name="file" type="file" accept=".xlsx,.xls" required></label><button class="wide">Carregar prévia — não confirmar dados ainda</button></form><div id="mapping"></div><h3>Histórico de importações</h3>'+state.imports.filter(r=>r.driver===driver()&&r.month===month()).map(r=>'<p>'+esc(r.category+' — '+r.status)+' · <a href="'+esc(r.original.url)+'" target="_blank" rel="noopener">Original</a></p>').join('')+'</section>';bindForm('import',async values=>{importPreview=await call('previewBonusImport',{driver:driver(),month:month(),category:values.category,file:await fileData(values.file)});setTimeout(showMapping,0)});if(importPreview)showMapping()}
function showMapping(){if(!$('mapping')||!importPreview)return;const headers=importPreview.preview?.[0]||[];const fields=['date','plate','time','description','speed','vehicleType','roadLimit','infraction','value','to'];$('mapping').innerHTML='<h3>Prévia e mapeamento</h3><pre>'+esc(JSON.stringify(importPreview.preview,null,2))+'</pre><form id="confirmImport"><label>Aba<select name="sheet">'+importPreview.tabs.map(t=>'<option>'+esc(t.name)+'</option>').join('')+'</select></label>'+fields.map(key=>'<label>'+esc(({date:'Data',plate:'Placa',time:'Horário',description:'Descrição',speed:'Velocidade',vehicleType:'Classe: CARRO / CAMINHONETE / ONIBUS / MICROONIBUS / outro',roadLimit:'Limite da via',infraction:'Número da infração',value:'Valor',to:'Fim da responsabilidade'})[key])+'<select name="'+key+'"><option value="">Não disponível</option>'+headers.map((h,i)=>'<option value="'+i+'">'+esc(h)+' (coluna '+(i+1)+')</option>').join('')+'</select></label>').join('')+'<button class="wide">Validar e confirmar importação</button></form>';bindForm('confirmImport',async values=>{const mapping=Object.fromEntries(fields.filter(k=>values[k]!=='').map(k=>[k,Number(values[k])]));const result=await call('confirmBonusImport',{id:importPreview.id,sheet:values.sheet,mapping});if(!result.confirmed)throw Error(JSON.stringify(result.errors));importPreview=null;message(result.rows+' linhas importadas; '+result.duplicates+' duplicadas ignoradas.')})}
function renderReports(){const reports=state.reports.filter(r=>r.month===month());$('content').innerHTML='<section><h2>Relatórios da competência</h2><p>Agendamento: '+(state.schedulerEnabled?'ativo · dia 10, aproximadamente às 08h, America/Sao_Paulo':'desativado')+'</p><p>Os quatro anexos precisam ser conferidos antes de cada envio. Valores pendentes não compõem o total aprovado. Nenhum e-mail é enviado só por gerar o relatório.</p><button id="prepareReport">Gerar PDF e Excel para conferência</button>'+reports.map(r=>'<details><summary>'+esc(r.month+' — '+r.status)+'</summary><p>Destinatários: '+esc(r.recipients.join(', '))+'</p><h3>'+esc(r.subject)+'</h3><pre>'+esc(r.body)+'</pre>'+r.files.map(f=>'<p><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.name)+'</a></p>').join('')+(r.status==='Aguardando conferência'?'<button data-approve-report="'+r.id+'">Registrar conferência e liberar envio</button>':'')+'</details>').join('')+'<div class="actions"><button id="enableMail">Ativar agendamento mensal</button><button id="disableMail">Desativar agendamento</button><button id="sendMail">Enviar relatório já conferido</button></div><h2>Histórico de E-mails de Bonificação</h2><pre>'+esc(JSON.stringify(state.mailHistory.filter(r=>r.month===month()),null,2))+'</pre></section>';$('prepareReport').onclick=()=>run(async()=>{await call('prepareBonusReport',month());await load()});$('content').querySelectorAll('[data-approve-report]').forEach(b=>b.onclick=()=>{const checked=confirm('Você abriu e conferiu os quatro anexos e o conteúdo do e-mail? A liberação permitirá envio aos quatro destinatários indicados.');const reason=checked&&prompt('Registre a conclusão da conferência:');if(reason)run(async()=>{await call('approveBonusReport',b.dataset.approveReport,reason,true);await load()})});$('enableMail').onclick=()=>{if(confirm('Ativar envio no dia 10, por volta das 08h, de relatórios previamente conferidos? O Google poderá solicitar novas permissões.'))run(async()=>{await call('configureBonusMonthlyEmail',true);await load()})};$('disableMail').onclick=()=>run(async()=>{await call('configureBonusMonthlyEmail',false);await load()});$('sendMail').onclick=()=>{if(confirm('Enviar agora o relatório desta competência previamente conferido aos quatro destinatários corporativos?'))run(async()=>{const result=await call('sendReviewedBonusReport',month());if(result.sent===false)throw Error(result.reason);await load()})}}
function renderConfig(){const latest=state.ruleVersions.at(-1);$('content').innerHTML='<section><h2>Configurações por vigência</h2><p>Não altera competências já registradas. Valores monetários em reais. A aprovação humana e a conferência de cada e-mail são obrigatórias. Destinatários e remetente seguem os endereços autorizados pelo gestor.</p><form id="config">'+input('Vigência inicial','from','month')+Object.entries(latest.rules).filter(([key])=>!['sendDay','sendHour','washEveryDays'].includes(key)).map(([key,value])=>input(({kmCents:'Tarifa por KM (R$)',trustCents:'Cargo de confiança (R$)',checklistCents:'Checklist (R$)',circulationCents:'Circulação (R$)',speedCents:'Velocidade (R$)',washCents:'Lavagem (R$)',finesCents:'Multas (R$)',allowedStart:'Horário inicial autorizado',allowedEnd:'Horário final autorizado',carLimit:'Limite de carros/caminhonetes (KM/H)',busLimit:'Limite de ônibus/micro-ônibus (KM/H)',otherLimit:'Limite dos demais veículos (KM/H)'})[key]||key,key,typeof value==='number'?'number':'text',true,key.endsWith('Cents')?value/100:value)).join('')+'<button class="wide">Salvar vigência futura</button></form><pre>'+esc(JSON.stringify(state.ruleVersions,null,2))+'</pre></section>';bindForm('config',values=>{const rules={...latest.rules};Object.keys(rules).forEach(key=>{if(values[key]!==undefined)rules[key]=key.endsWith('Cents')?Math.round(Number(values[key])*100):typeof rules[key]==='number'?Number(values[key]):values[key]});return call('saveBonusRules',{from:values.from,rules})})}
$('driver').onchange=()=>{importPreview=null;render()};$('month').onchange=()=>{importPreview=null;render()};const local=new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit'}).format(new Date());$('month').value=local;load();
</script></body></html>
